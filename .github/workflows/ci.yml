name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # нужно только для комментария с ошибками сборки к коммиту

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish vulscan-kit to Maven Local
        shell: bash
        run: |
          git clone --depth 1 https://github.com/tolegenjob/vulscan-kit.git ../vulscan-kit
          (cd ../vulscan-kit && ./gradlew publishToMavenLocal -PkitVersion=$(grep kitVersion= ../vulscan-core-backend/gradle.properties | cut -d= -f2) -x test)
      - name: Build and test
        shell: bash
        run: ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Report failure as commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI failed. Key lines:"
            echo '```'
            grep -E "^e: |^w: .*Unresolved|FAILED|error:|Unresolved|Could not|AssertionError|Expecting|Caused by|Exception" build.log | head -60
            echo '```'
            echo "Log tail:"
            echo '```'
            tail -n 60 build.log
            echo '```'
          } | head -c 60000 > failure.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@failure.md
