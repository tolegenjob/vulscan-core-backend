spring:
  application:
    name: vulscan-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vulscan}
    username: ${DB_USER:vulscan}
    password: ${DB_PASSWORD:vulscan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 6000
  session:
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

scanner:
  scope:
    allowed-private-cidrs: ${SCANNER_ALLOWED_PRIVATE_CIDRS:}
  secret:
    key-base64: ${SCANNER_SECRET_KEY:}
  service-tokens:
    xss: ${SCANNER_TOKEN_XSS:}
    sqli: ${SCANNER_TOKEN_SQLI:}
    idor: ${SCANNER_TOKEN_IDOR:}
  bootstrap-admin:
    user: ${SCANNER_BOOTSTRAP_ADMIN_USER:}
    password: ${SCANNER_BOOTSTRAP_ADMIN_PASSWORD:}
